<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Weekly dinner planner: pantry check, shopping list, prep and cooking steps.">
<title>Pantry to Plate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a four-step kitchen workflow (Pantry → Plan → Shop → Prep & cook) as numbered tabs over a single working column; lists read like a grocery ticket. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f3f4f2; --ink:#22252a; --muted:#6a6f77; --line:#e5e6e3;
  --accent:#1f6fd1; --accent-ink:#ffffff; --accent-soft:#e4eefb;
  --ok:#2c7a4c; --ok-soft:#e2f2e8;
  --mark:#f2b233; --need:#9c5600; --need-soft:#fff0d6;
  --f-display:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191d; --surface:#1f2227; --sunk:#25282e; --ink:#f1f2f4; --muted:#a3a8b0; --line:#30343b;
  --accent:#6aa8ff; --accent-ink:#08182f; --accent-soft:#172a45; --ok:#6cc892; --ok-soft:#1c3326;
  --mark:#f2b84b; --need:#f0b05a; --need-soft:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191d; --surface:#1f2227; --sunk:#25282e; --ink:#f1f2f4; --muted:#a3a8b0; --line:#30343b;
  --accent:#6aa8ff; --accent-ink:#08182f; --accent-soft:#172a45; --ok:#6cc892; --ok-soft:#1c3326;
  --mark:#f2b84b; --need:#f0b05a; --need-soft:#3a2a12; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
#acct{display:flex;align-items:center;gap:10px;font-size:.85rem;flex-wrap:wrap}
#acct .who{color:var(--muted)}
#acct .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px}
#acct .dot.off{background:var(--mark)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:24px 16px}
header.top p{margin:4px 0 0}
.serv{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.serv b{font-family:var(--f-mono);min-width:1.6em;text-align:center}
.round{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font-size:1.1rem;cursor:pointer;line-height:1}

.modes{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);margin-bottom:4px;max-width:100%}
.modes button{border:0;background:transparent;color:var(--muted);font:700 .9rem var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nextbar{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:8px;background:var(--bg);border-top:1px solid var(--line)}
.nextwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
button.btn.big{padding:12px 20px;font-size:1rem}
button.btn:disabled{opacity:.45;cursor:default}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
@media (max-width:440px){nav.tabs button{padding:6px 10px 6px 6px;font-size:.85rem;gap:6px}nav.tabs button .c{display:none}}
.hh{display:grid;gap:10px;margin-bottom:12px}
.hh .code{display:flex;align-items:baseline;gap:12px;background:var(--sunk);border-radius:8px;padding:10px 14px}
.hh .code b{font-size:1.3rem;letter-spacing:.08em}
button.btn.warn{border-color:var(--need);color:var(--need)}
#acct .link{font-size:.85rem}
.choose{display:grid;gap:22px;justify-items:center;text-align:center;padding-block:clamp(32px,10vh,90px)}
.choose h2{font-size:1.5rem;max-width:22ch}
.choices{display:grid;gap:12px;width:100%;max-width:440px}
.choice{display:grid;gap:4px;text-align:left;padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.choice b{font:700 1.15rem var(--f-display)}
.choice span{color:var(--muted);font-size:.92rem}
.choice:hover{border-color:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;overflow-x:auto}
nav.tabs .row{display:flex;gap:6px;min-width:max-content}
nav.tabs button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 8px;font:700 .95rem var(--f-body);cursor:pointer}
nav.tabs button .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--f-mono)}
nav.tabs button .c{font:500 .75rem var(--f-mono);color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button[aria-selected="true"] .n{background:var(--accent-ink);color:var(--accent)}
nav.tabs button[aria-selected="true"] .c{color:var(--accent-ink);opacity:.8}

main{display:grid;gap:20px;padding-top:12px}
section.block{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.head-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}

button.btn,label.btn,a.btn{font:700 .9rem var(--f-body);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.link{background:none;border:0;padding:0;color:var(--accent);font:700 .875rem var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button.warn{border-color:var(--need);color:var(--need)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input[type=text],select,textarea,input[type=number]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical}
.form{display:flex;flex-wrap:wrap;gap:8px}
.form input[type=text]{flex:1 1 200px}
details>summary{cursor:pointer;font-weight:700;color:var(--accent)}
details[open]>summary{margin-bottom:10px}

/* pantry */
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.loc h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:.9rem}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1}
.chip button:hover{background:var(--line);color:var(--ink)}
.empty{color:var(--muted);font-size:.9rem;font-style:italic}

/* meter */
.meter{display:flex;align-items:center;gap:8px;font-size:.85rem}
.bar{flex:0 0 90px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}

/* plan */
.week{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dn{font:700 .95rem var(--f-display)}
.day select{width:100%}
.pill{font:500 .75rem var(--f-mono);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.buy{background:var(--need-soft);color:var(--need)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.card .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.missing{font-size:.85rem;color:var(--need)}
.card .actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:700 .85rem var(--f-body);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ingredient + ticket lists */
.ing{list-style:none;margin:0;padding:0;display:grid}
.ing li{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.ing li:last-child{border-bottom:0}
.ing .q{font-family:var(--f-mono);font-size:.85rem;text-align:right;color:var(--muted)}
.ing .h{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ing .h.ok{color:var(--accent)} .ing .h.buy{color:var(--need)}
ol.steps{margin:0;padding-left:1.4rem;display:grid;gap:6px}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 12px}
.aisle{padding-top:12px}
.aisle .eyebrow{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:2px}
.check{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.check .for{display:block;font-size:.78rem;color:var(--muted)}
.check .q{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wm{font:700 .75rem var(--f-body);color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.wm:hover{background:var(--accent-soft)}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.9rem}
.stats b{font-family:var(--f-mono)}

/* prep */
.prepday{border-left:4px solid var(--mark);padding-left:12px}
.cook{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.cook .ttl{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}.day{grid-template-columns:48px minmax(0,1fr)}.day .pill{grid-column:2;justify-self:start}}

.scanlist{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.scanrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.scanmeta{grid-column:2 / -1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr);gap:6px}
@media (max-width:520px){.scanmeta{grid-template-columns:1fr 1fr}.scanmeta input{grid-column:1 / -1}}
.chip .amt{font:500 .75rem var(--f-mono);color:var(--muted);margin-left:6px}
.chip.low{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 14%,var(--sunk))}
.lownote{background:color-mix(in srgb,var(--mark) 18%,var(--surface))}
.scanrow:first-child{border-top:0}
.scanrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.scanrow input[type=text],.scanrow select{padding:6px 8px;width:100%}
.scanrow.off input[type=text]{color:var(--muted);text-decoration:line-through}
.scanrow .pill{justify-self:start}
.scanwait{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.9rem}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.scanerr{background:var(--need-soft);color:var(--need);border-radius:8px;padding:10px 14px;font-size:.9rem;font-weight:700}
label.btn{display:inline-flex;align-items:center}
.icready{align-items:center}
.icready a.btn{text-decoration:none;display:inline-flex}
.storebox{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.storebox a.btn,.pick a.btn{justify-self:start}
.pick{display:grid;gap:12px;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:14px 16px;scroll-margin-top:70px}
.pickstore{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.pickstore a{color:var(--accent)}
.plist{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.on{background:var(--accent-soft)}
.prow>span{min-width:0}
.check .pickbtn{font-size:.72rem;font-weight:500;color:var(--muted)}
.wm.set{background:var(--accent-soft)}
label.btn.ghost{background:transparent;color:var(--accent)}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rate button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:3px 10px;font:600 .8rem var(--f-body);cursor:pointer}
.rate .star.on{background:var(--mark);border-color:var(--mark);color:#1b241f}
.rate .who.up{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rate .who.down{background:var(--need-soft);border-color:var(--need);color:var(--need)}
.family{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.family input{flex:1 1 200px}
#cookSheet select{max-width:48%}
.item .amt{border:0;background:none;padding:2px 0;font:500 .78rem var(--f-mono);color:var(--muted);text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.item .amt.est{font-style:italic}
.amtedit{display:grid;gap:6px;margin-top:6px;width:100%}
.amtedit input,.amtedit select{width:100%}
.amtbtns{display:flex;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:10px;font-weight:700;font-size:.95rem;z-index:30;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;min-height:44px}
.toast button{border:0;background:transparent;color:var(--bg);font:700 .95rem var(--f-body);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 10px;cursor:pointer}
body.cooking .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}

/* ===== 2026-10 redesign: bottom tabs, Today, bigger targets, sheets, cook mode ===== */
:root{--tabh:58px}
html{-webkit-text-size-adjust:100%}
body{font-size:1rem;padding-bottom:calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
header.top{padding-block:10px 6px;align-items:center;flex-wrap:nowrap}
#acct{flex:0 1 auto;justify-content:flex-end;text-align:right}
@media (max-width:380px){header.top h1{font-size:1.15rem}}
header.top h1{font-size:1.35rem}
button.btn,label.btn,a.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;font-size:.95rem;text-decoration:none}
button.link{min-height:44px;padding:0 4px}
.round{width:44px;height:44px}
input[type=text],input[type=url],input[type=search],select,textarea,input[type=number]{min-height:44px;font-size:1rem}
input[type=url],input[type=search]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 200px}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:-6px}
.backrow button{min-height:44px;border:0;background:none;color:var(--accent);font:700 1rem var(--f-body);padding:0 8px 0 0;cursor:pointer}

/* bottom tab bar (HIG: main sections at the bottom, icon + short label) */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .row{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto}
nav.tabbar button{position:relative;height:var(--tabh);border:0;background:none;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:2px;font:700 .72rem var(--f-body);cursor:pointer;padding:0}
nav.tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button[aria-current="page"]{color:var(--accent)}
nav.tabbar .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--need);color:#fff;font:700 .68rem/18px var(--f-body);padding:0 5px}
body.cooking nav.tabbar,body.cooking header.top{display:none}

/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Today */
.tonight{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:18px;display:grid;gap:10px}
.tonight h2{font-size:1.6rem}
.tonight .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tonight .btn.big{padding:14px 22px;font-size:1.05rem}
.nudges{display:grid;gap:8px}
.nudge{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.nudge .ic{font-size:1.2rem;text-align:center}
.nudge.warm{background:color-mix(in srgb,var(--mark) 14%,var(--surface));border-color:color-mix(in srgb,var(--mark) 45%,var(--line))}
.weekstrip{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.wrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:6px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.wrow:first-child{border-top:0}
.wrow .dn{font:700 .9rem var(--f-display);color:var(--muted)}
.wrow.today{background:var(--accent-soft)}
.wrow.today .dn{color:var(--accent)}
.wrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .nm.open{color:var(--muted);font-style:italic}
.pill.muted{background:var(--sunk);color:var(--muted)}

/* Kitchen */
.addbox{display:grid;gap:8px}
.addbox .form input[type=text]{flex:1 1 180px}
.addbox .dest{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);white-space:nowrap}
input::-webkit-calendar-picker-indicator{display:none!important}
.seg button{min-height:44px}
.filters button{min-height:44px;padding:6px 14px}
.rate button{min-height:44px;padding:4px 12px}
.addbox .dest select{min-height:44px;padding:4px 8px;font-size:.95rem}
.loclist>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font:700 1.05rem var(--f-display);color:var(--ink)}
.loclist>summary::-webkit-details-marker{display:none}
.loclist>summary::after{content:"›";transform:rotate(90deg);color:var(--muted);font-size:1.3rem;transition:transform .15s}
.loclist:not([open])>summary::after{transform:none}
.items{display:grid}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center;min-height:48px;border-top:1px solid var(--line)}
.item .nm{min-width:0}
.item .amt{display:block;font-size:.8rem;color:var(--muted)}
.item.low .nm b{color:var(--need)}
.item button{min-width:44px;min-height:44px;border:0;background:none;border-radius:8px;color:var(--muted);font:700 .8rem var(--f-body);cursor:pointer}
.item button:hover{background:var(--sunk);color:var(--ink)}
.item button.on{color:var(--need)}
.item button.x{font-size:1.3rem;font-weight:400}

/* Plan */
.daybtn{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:60px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.daybtn:first-child{border-top:0}
.daybtn .dn{font:700 .95rem var(--f-display)}
.daybtn.today{background:var(--accent-soft)}
.week.multi .daybtn{grid-template-columns:72px minmax(0,1fr) auto;min-height:52px}
.week.multi .daybtn .dn{font:700 .8rem var(--f-body);color:var(--muted)}
.week.multi .daybtn.today{background:none}
.dayhd{padding:10px 14px 4px;font:700 1rem var(--f-display);border-top:1px solid var(--line);background:var(--sunk)}
.dayhd:first-child{border-top:0}
.dayhd.today{background:var(--accent-soft);color:var(--accent)}
.profbar{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.profbar>span{flex:1 1 12rem}
.nofit{font-size:.85rem;color:var(--need);font-weight:600}
.optnote{padding:8px 14px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);background:var(--sunk)}
.optnote[data-sep]{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.75rem}
.profsheet{display:grid;gap:10px;padding:4px 14px 18px}
.profsheet h3{margin:6px 0 0;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font:600 .9rem var(--f-body);cursor:pointer;text-align:left;min-height:44px}
.chips button small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.8}
.hfbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 .85rem var(--f-body);cursor:pointer;min-height:40px;white-space:nowrap}
.hfbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hfbar{padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:.95rem}
.prow.seen b{color:var(--muted);text-decoration:line-through}
.chips button.mini{min-height:36px;padding:4px 10px;font-size:.8rem;border-radius:999px}
.pperson{display:grid;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.weekstrip.meals .wrow{grid-template-columns:5.5em minmax(0,1fr) auto}
.daybtn .nm{min-width:0}
.daybtn .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daybtn .nm small{color:var(--muted)}
.daybtn .nm .open{color:var(--muted);font-style:italic;font-weight:400}
.servbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 14px;font-size:.9rem}
.servbox b{font-family:var(--f-mono);min-width:1.6em;text-align:center}
.servbox .round{border:0;background:var(--sunk)}

/* bottom sheet (HIG: a sheet for a focused choice) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px}
.sheet .tools{display:grid;gap:8px;padding-bottom:10px}
.sheet .list{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:56px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt:first-child{border-top:0}
.opt small{display:block;color:var(--muted)}
.opt.sel{background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sheetup .22s ease-out}@keyframes sheetup{from{transform:translateY(30px);opacity:.6}}}

/* Shop */
.shoprow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:52px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.shoprow:last-child{border-bottom:0}
.shoprow input{width:24px;height:24px;margin:0;accent-color:var(--accent)}
.shoprow .t b{font-weight:700}
.shoprow .for{display:block;font-size:.8rem;color:var(--muted)}
.shoprow .q{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap;text-align:right}
.shoprow.done .t b{text-decoration:line-through;color:var(--muted)}
.by{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font:700 .7rem var(--f-body);padding:0 6px;margin-left:6px}
.donebar{position:sticky;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.donebar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sendbox>summary{min-height:44px;display:flex;align-items:center}

/* Prep groups */
.pgroup .eyebrow{border-bottom:2px solid var(--ink);padding-bottom:4px;margin:12px 0 2px;display:flex;justify-content:space-between}
.check{min-height:48px;align-items:center}
.check input{width:22px;height:22px;margin:0}

/* Cook mode: full screen, one step at a time, big type, thumb-height buttons */
.cookmode{display:grid;gap:16px;padding-bottom:110px}
.cookmode .top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.cookmode .top button{min-height:44px;border:0;background:none;color:var(--accent);font:700 1rem var(--f-body);cursor:pointer;padding:0 6px}
.cookmode .prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.cookmode .prog i{display:block;height:100%;background:var(--accent)}
.stepnum{font:700 .95rem var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.steptext{font:500 clamp(1.45rem,5.5vw,2rem)/1.35 var(--f-body);margin:0}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .clock{font:700 2rem var(--f-mono)}
.cooknav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);max-width:880px;margin:0 auto}
.cooknav .btn{min-height:56px;font-size:1.1rem;border-radius:12px}
.cooknav .ghost{background:var(--surface)}
.ingbig .ing li{grid-template-columns:6rem minmax(0,1fr) auto;font-size:1.05rem;padding:8px 0}
.ingbig .ing .q{font-size:.95rem}

/* ===== v3: photo-first, one typeface, plain lists instead of boxes ===== */
body{font:17px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em}
h2{font-size:1.3rem;font-weight:800}
.eyebrow,.tag,.stepnum,.ing .h,.optnote[data-sep]{text-transform:none;letter-spacing:0}
.eyebrow{font-size:.85rem}
header.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:2rem;font-weight:800;letter-spacing:-.025em}
.gear{width:44px;height:44px;border:0;border-radius:50%;background:var(--sunk);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
body.detail header.top,body.setup header.top,body.detail nav.tabbar,body.setup nav.tabbar{display:none}
main{gap:24px}
.panel,.card,.storebox,.tonight,.nudge,.scanlist,.plist,.ticket{border:0}
.panel{background:var(--sunk);border-radius:16px}
.card{background:var(--sunk);border-radius:16px}
.storebox{background:var(--sunk);border-radius:16px}
.ticket{background:none;padding:0}
.week,.weekstrip{border:0;border-radius:0;background:none}
.daybtn,.wrow,.item,.opt{border-top:1px solid var(--line)}
.aisle .eyebrow,.pgroup .eyebrow{border-bottom:0;font-size:1rem;color:var(--ink);font-weight:800;padding-top:8px}
.shoprow,.check,.ing li{border-bottom:1px solid var(--line)}
button.btn,label.btn,a.btn{border-radius:12px;min-height:48px;font:700 1rem var(--f-body);padding:10px 18px}
button.ghost,label.btn.ghost,a.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
button.link{text-decoration:none;color:var(--accent);font:700 .95rem var(--f-body)}
input[type=text],input[type=url],input[type=search],select,textarea,input[type=number]{background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--line);outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.pill{font:700 .75rem var(--f-body);padding:3px 9px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.ing .h.ok{color:var(--ok)}
.bar i{background:var(--ok)}
.note{background:var(--sunk)}
.filters button{border:0;background:var(--sunk)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabbar{background:color-mix(in srgb,var(--bg) 94%,transparent)}
nav.tabbar .row{grid-template-columns:repeat(5,1fr)}
nav.tabbar button{font:700 .7rem var(--f-body)}
.servbox{border:0;background:var(--sunk)}
.servbox .round{background:var(--surface)}
.sheet{background:var(--bg);grid-template-rows:auto auto auto minmax(0,1fr)}
.block{display:grid;gap:12px;align-content:start}
#recView{display:grid;gap:28px}
.shelf+.shelf{margin-top:4px}
body.detail main{padding-top:0}
.tonight .ph.wide{aspect-ratio:16/9}
.tonight .ph.wide .food{font-size:16cqw}
body[data-tab="settings"] .gear{visibility:hidden}
.panel input[type=text],.panel input[type=url],.panel input[type=search],.panel select,.panel textarea,.panel input[type=number]{background:var(--surface)}
.loclist.panel{background:none;padding:0;border-radius:0}
.loclist>summary{font-size:1.25rem;font-weight:800;min-height:56px}
.sheet .list{border:0;border-radius:0;background:none}
.nudge{background:var(--sunk);border-radius:14px}
.nudge.warm{background:var(--need-soft)}
.details-quiet>summary{color:var(--ink)}

/* private-test gate */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gatebox{max-width:460px;margin:0 auto;display:grid;gap:16px}
.gatebox .ph{border-radius:20px}
.gatebox h1{font-size:2rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.gatebox .lede{margin:0;color:var(--muted);font-size:1.05rem}
.gatebox .btn{width:100%;min-height:54px}
.gateform{display:grid;gap:10px}
.gateform input{font-size:1.4rem;letter-spacing:.12em;text-align:center;text-transform:uppercase}
.gateerr{margin:0;padding:10px 14px;border-radius:12px;background:var(--need-soft);color:var(--need);font-weight:600}
.gatebox a{color:var(--accent);font-weight:700}
body.gated nav.tabbar,body.gated header.top,body.gated main{visibility:hidden}
.fbkinds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fbkinds button{min-height:48px;border:2px solid transparent;border-radius:12px;background:var(--sunk);color:var(--ink);font:600 .9rem var(--f-body);cursor:pointer}
.fbkinds button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* placeholder photos: a plate on a tablecloth, colored per recipe; real photos go in recipe.img */
.ph{display:block;position:relative;aspect-ratio:1;overflow:hidden;container-type:inline-size;background-color:var(--phbg,#f3e3c3);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 7px,transparent 7px 20px),repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 7px,transparent 7px 20px)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .plate{position:absolute;left:50%;top:50%;height:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;
  box-shadow:0 8px 18px rgba(60,40,20,.16),inset 0 0 0 5px #fff,inset 0 0 0 7px #ecebe6;display:grid;place-items:center}
.ph .food{font-size:28cqw;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.ph.wide{aspect-ratio:4/3}
.ph.wide .food{font-size:22cqw}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ph{filter:brightness(.88)}}

/* Recipes: rows of photos, then a grid */
.recbar{display:flex;gap:10px;align-items:center}
.recbar input[type=search]{flex:1 1 auto}
.mealseg{display:flex;gap:6px}
.mealseg button{flex:1;min-height:44px;border:0;border-radius:999px;background:var(--sunk);color:var(--ink);font:700 .95rem var(--f-body);cursor:pointer}
.mealseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.shelf{display:grid;gap:12px}
.shelf h2{font-size:1.25rem}
.rowscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,42%);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:0 16px 4px;scrollbar-width:none}
.rowscroll::-webkit-scrollbar{display:none}
.rowscroll .tile{scroll-snap-align:start}
@media (min-width:700px){.rowscroll{grid-auto-columns:200px}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:grid;gap:8px;align-content:start;min-width:0}
.tile .open{border:0;padding:0;background:none;color:var(--ink);text-align:left;cursor:pointer;display:grid;gap:8px;font:inherit}
.tile .ph{border-radius:18px}
.tile .tn{font:700 1rem/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tm{font-size:.85rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tile .tm .ready{color:var(--ok);font-weight:700}
.tile .tm .warn{color:var(--need);font-weight:700}
.tadd{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#22252a;font:500 1.5rem/1 var(--f-body);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center}
.tadd.on{background:var(--ok);color:#fff;font-size:1.1rem;font-weight:800}
.searching .shelf.row{display:none}
.quiet{color:var(--muted);font-size:.9rem}

/* recipe page */
.hero{position:relative;margin:0 -16px}
.hero .ph{border-radius:0;max-height:52vh;width:100%}
.hbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#22252a;font:700 1.3rem/1 var(--f-body);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center}
.hbtn.back{left:16px}
.hbtn.edit{right:16px;width:auto;padding:0 16px;border-radius:999px;font-size:.95rem}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding-top:18px}
.rhead h1{font-size:1.9rem;font-weight:800;letter-spacing:-.025em;line-height:1.12}
.heart{width:48px;height:48px;border:0;border-radius:50%;background:var(--sunk);color:var(--ink);font-size:1.5rem;cursor:pointer}
.heart.on{color:var(--accent);background:var(--accent-soft)}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);margin:0}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;margin-inline:-16px;padding-inline:16px}
.rtabs button{min-height:50px;border:0;background:none;color:var(--muted);font:700 1rem var(--f-body);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.rtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:1.05rem}
.rlist .q{color:var(--muted);text-align:right;white-space:nowrap}
.rlist .mk{color:var(--ok);font-weight:800}
.rlist .mk.no{color:var(--line)}
.rsteps{list-style:none;margin:0;padding:0;counter-reset:st}
.rsteps li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;padding:16px 0;border-bottom:1px solid var(--line);counter-increment:st}
.rsteps li::before{content:counter(st);font:800 1.4rem/1.2 var(--f-body);color:var(--muted)}
.rsteps p{margin:0;font-size:1.08rem}
.uses{margin:8px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.95rem}
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);max-width:880px;margin:0 auto}
.rbar .btn{min-height:54px;font-size:1.05rem;border-radius:14px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:14px;padding:4px;min-height:54px}
.stepper button{width:44px;height:44px;border:0;border-radius:10px;background:var(--surface);color:var(--ink);font:700 1.3rem var(--f-body);cursor:pointer}
.stepper span{min-width:4.6em;text-align:center;font-weight:700;font-size:.95rem;line-height:1.1}
.stepper small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
body.detail{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* setup flow */
.su{min-height:calc(100dvh - 40px);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:18px;padding-bottom:110px}
.sutop{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding-top:env(safe-area-inset-top,0px)}
.sutop button{border:0;background:none;color:var(--accent);font:700 1rem var(--f-body);min-height:44px;cursor:pointer;padding:0}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);width:22px;border-radius:4px}
.su h1{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.su .lede{color:var(--muted);font-size:1.05rem;margin:8px 0 0}
.bigrows{display:grid;gap:10px}
.bigrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:62px;padding:12px 18px;border-radius:16px;border:2px solid transparent;background:var(--sunk);color:var(--ink);font:700 1.1rem var(--f-body);text-align:left;cursor:pointer}
.bigrow small{font:500 .9rem var(--f-body);color:var(--muted);text-align:right}
.bigrow[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.bigchips{display:flex;flex-wrap:wrap;gap:10px}
.bigchips button{min-height:50px;padding:10px 18px;border-radius:14px;border:2px solid transparent;background:var(--sunk);color:var(--ink);font:600 1.05rem var(--f-body);cursor:pointer}
.bigchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.whoseg{display:flex;gap:6px;overflow-x:auto}
.whoseg button{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .9rem var(--f-body);cursor:pointer;white-space:nowrap}
.whoseg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.suintro{display:grid;gap:22px;padding-top:4vh}
.suintro .pt{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;font-size:1.15rem;font-weight:600}
.suintro .pt .ph{border-radius:50%}
.sunext{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);max-width:880px;margin:0 auto}
.sunext .btn{width:100%;min-height:56px;font-size:1.1rem;border-radius:16px}
.alllist{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
.alllist button{display:flex;justify-content:space-between;width:100%;min-height:50px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 1.05rem var(--f-body);text-align:left;cursor:pointer;padding:0 4px}
.alllist button[aria-pressed="true"]{font-weight:800}
.alllist button[aria-pressed="true"]::after{content:"✓";color:var(--accent)}

/* settings */
.sgroup{display:grid}
.sgroup h2{font-size:1.05rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:600 1.05rem var(--f-body);text-align:left;width:100%;cursor:pointer}
.srow small{display:block;font-weight:500;color:var(--muted);font-size:.9rem}
.srow .chev{color:var(--muted);font-size:1.4rem}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
[aria-pressed="true"]>.toggle{background:var(--ok)}
[aria-pressed="true"]>.toggle::after{left:23px}
#acctbox{display:grid;gap:12px;margin-top:12px}
#acctbox #acct{justify-content:flex-start}

/* Today / Plan with photos */
.tonight{background:none;padding:0;gap:12px}
.tonight .ph{border-radius:20px}
.tonight h2{font-size:1.7rem}
.thumb{width:52px;height:52px;flex:0 0 auto}
.thumb .ph{border-radius:12px;width:52px;height:52px}
.daybtn{grid-template-columns:52px 52px minmax(0,1fr) auto;min-height:72px;padding:10px 0}
.week.multi .daybtn{grid-template-columns:72px 52px minmax(0,1fr) auto}
.daybtn.today{background:none}
.daybtn.today .dn{color:var(--accent)}
.dayhd{background:none;padding:18px 0 4px;font-size:1.1rem;font-weight:800}
.dayhd.today{background:none;color:var(--accent)}
.wrow{grid-template-columns:48px 44px minmax(0,1fr) auto;padding:8px 0;min-height:60px}
.wrow .thumb,.wrow .thumb .ph{width:44px;height:44px}
.weekstrip.meals .wrow{grid-template-columns:5.5em 44px minmax(0,1fr) auto}
.wrow.today{background:none}
.wrow.today .dn{color:var(--accent)}
.opt{grid-template-columns:52px minmax(0,1fr) auto;padding:10px 0}
.opt.sel{background:var(--accent-soft);border-radius:12px;padding-inline:8px}
.opt.plain{grid-template-columns:minmax(0,1fr) auto}
.optnote{background:none;padding:14px 0 6px}
.profbar{border:0}
.cooknow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepuses{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line);list-style:none;display:grid;gap:4px;font-size:1.1rem}
.stepuses b{font-weight:700}

    Object.entries(TRAITS).forEach(([k,re])=>{if(re.test(n))t.add(k)})});
  if(t.has("gluten"))t.add("grain");_traits.set(r,t);return t}
const listOf=t=>String(t||"").split(/[,;\n]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
const FIT_OK={ok:true,why:[]};
const NOT_THE_FOOD=new Set(["oil","powder","extract","sauce","broth","seasoning","juice","vinegar","stock"]);
function dislikeHit(d,t){if(d.length>t.length)return false;const end=d.every((w,i)=>t[t.length-d.length+i]===w),start=d.every((w,i)=>t[i]===w);
  return end||(start&&!NOT_THE_FOOD.has(t[t.length-1]))}
function fit(r){const P=S.profile;if(!P||!r||!r.ing)return FIT_OK;const t=traits(r),why=[];
  (DIET_NO[P.diet]||[]).forEach(x=>{if(t.has(x))why.push(TLABEL[x])});
  const who=w=>w==="Everyone"?"":` (${w})`;
  Object.entries(P.allergies||{}).forEach(([w,list])=>(list||[]).forEach(a=>{if(t.has(a))why.push(TLABEL[a]+who(w))}));
  Object.entries(P.dislikes||{}).forEach(([w,txt])=>listOf(txt).forEach(d=>{const dn=norm(d);if(dn.length&&r.ing.some(i=>dislikeHit(dn,norm(i[2]))))why.push(d+who(w))}));
  return why.length?{ok:false,why:[...new Set(why)]}:FIT_OK}

const fits=r=>SHOWALL||fit(r).ok;

      skip:all().filter(r=>mealOf(r)===MEALF).map(r=>r.name).concat(kept.map(r=>r.name)).slice(0,200),cats:CATS});

    const pqty=p.qty||guessQty(p),pk=parseQty(pqty),sm=pk&&(pk.rest.match(/\((\d+(?:\.\d+)?)\s*(oz|lb|gal|cup)\)/)||(pk.n>0&&["gal","lb","oz"].includes(pk.u)&&!pk.rest.trim()&&pk.w?((pk.w=(pk.u==="gal"?"jug":"pkg")),[null,String(pk.n),pk.u]):null));

<script>

   Mode, current step and "hungry now" pick stay per person. */
(function(){
  const el=document.getElementById("acct"), hh=document.getElementById("hh");
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase){el.innerHTML='<span class="who">Saved on this device</span>';return}
  firebase.initializeApp(cfg);
  /* Local testing only: ?emu on localhost talks to the Firebase emulators instead of the live project. */
  if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has("emu")){
    firebase.auth().useEmulator("http://127.0.0.1:9099");firebase.firestore().useEmulator("127.0.0.1",8080);
    firebase.app().functions("us-central1").useEmulator("127.0.0.1",5001);window.USE_SERVER=true;window.APP_CHECK_SITE_KEY="";window.EMU=true}
  /* Abuse protection: App Check proves requests come from this app, not a script. */
  if(window.APP_CHECK_SITE_KEY&&firebase.appCheck){try{firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(window.APP_CHECK_SITE_KEY),true)}catch(e){console.warn("App Check not started",e)}}
  /* AI features run on the server (sign-in, daily limits, abuse checks). Turned on with USE_SERVER in firebase-config.js. */
  if(window.USE_SERVER&&firebase.functions){
    const fns=firebase.app().functions("us-central1");

    const callAI=async(name,feature,data)=>{

      try{const r=await fns.httpsCallable(name,{timeout:130000})(data);const d=r.data||{};
        const left=d.left&&d.left.person;if(typeof left==="number"&&left<=2)setTimeout(()=>toast(left?`${left} ${NAMES[feature]} left today`:`That was your last ${NAMES[feature].replace(/s$/,"")} for today`),600);
        return d.result}

  }
  const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue;
  const FP=firebase.firestore.FieldPath;
  let user=null,userRef=null,ref=null,unsub=null,timer=null,lastF=null,house=null,hdata=null,panelOpen=false,leaveArm=false,syncState="sync";
  const joinParam=(new URLSearchParams(location.search).get("join")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const first=()=>user&&user.displayName?user.displayName.split(" ")[0]:"Someone";
  const fmt=c=>c.slice(0,5)+"-"+c.slice(5);
  const newCode=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const r=crypto.getRandomValues(new Uint32Array(10));r.forEach(n=>c+=A[n%A.length]);return c};
  const inviteLink=c=>location.origin+location.pathname+"?join="+c;

    const status=syncState==="err"?'<span class="dot off"></span>Sync paused':syncState==="sync"?'<span class="dot off"></span>Syncing…':`<span class="dot"></span>${house?`Shared · ${n} ${n===1?"person":"people"}`:"Synced · "+esc(first())}`;

      <div class="form"><button class="btn" data-acct="invite">Send invite</button><button class="btn ghost ${leaveArm?"warn":""}" data-acct="leave">${leaveArm?"Tap again to leave":"Leave household"}</button></div>
      <p class="small muted" style="margin:0">To add someone: send the invite, have them open it and sign in with their own Google account. Check-offs show the first letter of who checked them.</p>

    return `<div class="head-row"><h3>Share with your household</h3><button class="link" data-acct="close">Close</button></div>
    <p class="small" style="margin:0">Start a household to share one pantry, plan and store list with the people you live with. Each person signs in with their own Google account.</p>
    <div class="form"><button class="btn" data-acct="create">Start a household</button></div>
    <div class="form"><input type="text" id="joinCode" placeholder="Have a code? e.g. ABCDE-FGHJK" value="${joinParam?fmt(joinParam):""}" autocomplete="off" aria-label="Household invite code" style="text-transform:uppercase"><button class="btn ghost" data-acct="join">Join</button></div>
    <p class="small muted" style="margin:0">Joining shows the household's planner. Your own planner is kept and comes back if you leave.</p>
    <div><button class="link" data-acct="out">Sign out</button></div>`;
  }

  el.addEventListener("click",onClick);hh.addEventListener("click",onClick);
  async function onClick(e){
    const b=e.target.closest("[data-acct]");if(!b)return;const a=b.dataset.acct;
    if(a==="in"){const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(err=>{if(/popup/.test(err.code||""))auth.signInWithRedirect(p);else toast("Sign-in didn't finish. Try again.")});return}
    if(a==="out"){auth.signOut();return}
    if(a==="hh"){panelOpen=!panelOpen;leaveArm=false;show();return}
    if(a==="close"){panelOpen=false;show();return}
    if(a==="create"){b.disabled=true;
      try{const code=newCode();const current=toCloud(S);
        await db.collection("households").doc(code).set({members:[user.uid],names:{[user.uid]:first()},state:current,created:FV.serverTimestamp()});
        await userRef.set({household:code},{merge:true});await attach(code);toast("Household started. Send the invite to add people.");
      }catch(err){console.error(err);toast(permMsg(err));b.disabled=false}return}
    if(a==="join"){const code=(document.getElementById("joinCode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length!==10){toast("Codes are 10 letters and numbers, like ABCDE-FGHJK.");return}
      b.disabled=true;
      try{await db.collection("households").doc(code).update({members:FV.arrayUnion(user.uid),["names."+user.uid]:first()});
        await userRef.set({household:code},{merge:true});await attach(code);
        if(joinParam)history.replaceState(null,"",location.pathname);toast("You joined the household.");
      }catch(err){console.error(err);toast(/not-found|NOT_FOUND|No document/i.test(String(err.code||err.message))?"That code wasn't found. Check it and try again.":permMsg(err));b.disabled=false}return}
    if(a==="invite"){const link=inviteLink(house),text=`Join our meal planner on Pantry to Plate: ${link}\n(Code: ${fmt(house)})`;
      if(navigator.share){try{await navigator.share({title:"Pantry to Plate household",text});return}catch(e){if(e&&e.name==="AbortError")return}}
      try{await navigator.clipboard.writeText(text);toast("Invite copied. Paste it in a text or email.")}catch(e){prompt("Copy this invite:",text)}return}
    if(a==="leave"){if(!leaveArm){leaveArm=true;show();return}
      try{const code=house;await db.collection("households").doc(code).update({members:FV.arrayRemove(user.uid),["names."+user.uid]:FV.delete()});
        await userRef.set({household:FV.delete()},{merge:true});leaveArm=false;await attach(null);toast("You left the household. Your own planner is back.");
      }catch(err){console.error(err);toast(permMsg(err))}return}
  }
  const permMsg=err=>/permission|PERMISSION_DENIED/i.test(String(err&&(err.code||err.message)))?"Household sharing isn't allowed yet. The Firestore rules need the households section.":"That didn't work. Check your connection and try again.";

  const legacy=st=>LISTF.some(k=>Array.isArray(st[k])&&!st[k+"M"]);
  const fpath=p=>{const i=p.indexOf(SEP);return i<0?new FP("state",p):new FP("state",p.slice(0,i),p.slice(i+1))};
  // Show the remote copy plus any of my changes that haven't been sent yet.
  function apply(st){
    const remoteF=flat(toCloud(Object.assign({},fromCloud(st))));
    const mineF=flat(toCloud(S));
    const base=lastF||remoteF;
    const mergedF=lastF?mergeFlat(base,mineF,remoteF):remoteF;
    lastF=remoteF;
    if(JSON.stringify(mergedF)!==JSON.stringify(mineF)){
      const keep={};LOCAL.forEach(k=>keep[k]=S[k]);
      S=Object.assign(defaults(),fromCloud(unflat(mergedF)),keep);
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
      render(true);
    }
    if(JSON.stringify(mergedF)!==JSON.stringify(remoteF))push();
  }
  // Send only the fields that changed since the last copy we saw.
  function push(){
    if(!ref||!lastF)return;
    const mineF=flat(toCloud(S)),d=fdiff(lastF,mineF);
    if(!d.set.length&&!d.del.length)return;
    const args=[];d.set.forEach(p=>args.push(fpath(p),JSON.parse(mineF[p])));d.del.forEach(p=>args.push(fpath(p),FV.delete()));
    args.push(new FP("updated"),FV.serverTimestamp());
    lastF=mineF;syncState="sync";show();
    ref.update(...args).then(()=>{syncState="in";show()}).catch(e=>{
      if(/not-found|NOT_FOUND|No document/i.test(String(e.code||e.message)))return ref.set({state:toCloud(S),updated:FV.serverTimestamp()},{merge:true}).then(()=>{syncState="in";show()});
      throw e}).catch(e=>{console.error(e);syncState="err";show()});
  }
  window.cloudPush=function(){if(!ref)return;clearTimeout(timer);timer=setTimeout(push,400)};
  async function attach(code){
    if(unsub){unsub();unsub=null}lastF=null;house=code;hdata=null;syncState="sync";show();
    ref=code?db.collection("households").doc(code):userRef;
    const snap=await ref.get();
    if(code)hdata=snap.data()||null;
    const st=snap.exists?snap.data().state:null;
    if(st&&legacy(st)){
      // One-time move from the old "whole planner" format to item-level fields.
      apply(st);await ref.update(new FP("state"),toCloud(S));lastF=flat(toCloud(S));
    }else if(st)apply(st);
    else{lastF={};await ref.set({state:toCloud(S),updated:FV.serverTimestamp()},{merge:true});lastF=flat(toCloud(S))}
    unsub=ref.onSnapshot(sn=>{
      if(!sn.exists){return}
      if(code){hdata=sn.data();if(!(hdata.members||[]).includes(user.uid)){attach(null);return}}
      if(sn.data().state)apply(sn.data().state);

    },e=>{console.error(e);syncState="err";show()});

        localStorage.setItem("pantry-to-plate.req",JSON.stringify(sent.slice(-500)))}catch(e){console.warn("product requests not saved",e)}return}let sent=[];try{sent=JSON.parse(localStorage.getItem("pantry-to-plate.req")||"[]")}catch(e){}

    try{localStorage.setItem("pantry-to-plate.req",JSON.stringify(sent.slice(-500)))}catch(e){}};
  /* ---------- private test: invite-only gate (only when the server is on and appConfig/access.inviteOnly) ---------- */
  const inviteParam=(new URLSearchParams(location.search).get("invite")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
  try{if(inviteParam)sessionStorage.setItem("ptp.invite",inviteParam)}catch(e){}
  const savedInvite=()=>{try{return sessionStorage.getItem("ptp.invite")||""}catch(e){return ""}};
  let gateEl=null,gateBusy=false;
  async function inviteOnly(){if(!window.USE_SERVER)return false;try{const s=await db.doc("appConfig/access").get();return s.exists&&!!s.get("inviteOnly")}catch(e){return false}}
  async function isMember(u){try{return (await db.doc("members/"+u.uid).get()).exists}catch(e){return false}}
  function ungate(){if(gateEl){gateEl.remove();gateEl=null}document.body.classList.remove("gated")}
  function gate(mode,msg){
    if(!gateEl){gateEl=document.createElement("div");gateEl.className="gate";gateEl.setAttribute("role","dialog");gateEl.setAttribute("aria-modal","true");gateEl.setAttribute("aria-labelledby","gateTitle");document.body.appendChild(gateEl);
      gateEl.addEventListener("click",onGate);gateEl.addEventListener("submit",e=>{e.preventDefault();redeem()})}
    document.body.classList.add("gated");const c=fmtInvite(document.getElementById("gateCode")?document.getElementById("gateCode").value:savedInvite());
    gateEl.innerHTML=`<div class="gatebox"><span class="ph wide" style="--phbg:#cde0f2" aria-hidden="true"><span class="plate"><span class="food">🍽️</span></span></span>
      <h1 id="gateTitle">${mode==="signin"?"Pantry to Plate is in a private test":"Enter your invite code"}</h1>
      ${mode==="signin"?`<p class="lede">Sign in, then enter the invite code you were sent. A family can share one code.</p>
        <button class="btn" data-gate="in">Sign in with Google</button>`
      :`<p class="lede">Signed in as ${esc(user&&(user.email||user.displayName)||"you")}. <button class="link" data-gate="out">Use a different account</button></p>
        <form id="gateForm" class="gateform"><input type="text" id="gateCode" value="${esc(c)}" placeholder="ABCD-EF23" autocomplete="one-time-code" autocapitalize="characters" aria-label="Invite code" maxlength="9"><button class="btn" type="submit"${gateBusy?" disabled":""}>${gateBusy?"Checking…":"Continue"}</button></form>`}
      ${msg?`<p class="gateerr" role="alert">${esc(msg)}</p>`:""}
      <p class="quiet">No code yet? <a href="join.html">Join the waitlist</a> and we'll send one.</p></div>`;
    const f=document.getElementById("gateCode");if(f)setTimeout(()=>f.focus(),50)}

    if(b.dataset.gate==="in"){const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(err=>{if(/popup/.test(err.code||""))auth.signInWithRedirect(p);else gate("signin","Sign-in didn't finish. Try again.")})}
    if(b.dataset.gate==="out")auth.signOut()}
  async function redeem(){const code=(document.getElementById("gateCode")||{}).value||"";if(gateBusy)return;gateBusy=true;gate("code");
    try{await firebase.app().functions("us-central1").httpsCallable("redeemInvite")({code});try{sessionStorage.removeItem("ptp.invite")}catch(e){}
      gateBusy=false;ungate();toast("You're in. Welcome to the test!");await onUser(user)}
    catch(err){gateBusy=false;gate("code",String(err&&err.message||err).replace(/\s*\[\d{3}\]\s*$/,""))}}
  if(window.USE_SERVER)window.sendFeedback=d=>firebase.app().functions("us-central1").httpsCallable("sendFeedback")(d).then(r=>r.data).catch(e=>{throw new Error(String(e&&e.message||e).replace(/\s*\[\d{3}\]\s*$/,""))});

  auth.onAuthStateChanged(u=>onUser(u));

    }catch(e){console.error(e);syncState="err";show()}
  }
})();

<script type="module">
/* Photo scan: Gemini via Firebase AI Logic (no API key in the page; uses this Firebase project). */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAI, getGenerativeModel, GoogleAIBackend, Schema } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey && !window.USE_SERVER) {
  const app = initializeApp(cfg, "pantry-scan");
  const ai = getAI(app, { backend: new GoogleAIBackend() });
  const schema = Schema.object({ properties: { items: Schema.array({ items: Schema.object({ properties: {
    name: Schema.string(),
    location: Schema.enumString({ enum: ["Fridge", "Freezer", "Pantry", "Spices"] }),
    quantity: Schema.string(),
    remaining: Schema.enumString({ enum: ["full", "most", "half", "low", "empty", "unknown"] }),
    confidence: Schema.enumString({ enum: ["high", "low"] })
  }, optionalProperties: ["quantity"] }) }) } });
  // Tried in order; moves on when a model is busy or over its free-tier limit.
  const MODELS = ["gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-3.1-flash-lite"];
  const models = MODELS.map(m => getGenerativeModel(ai, { model: m,
    generationConfig: { responseMimeType: "application/json", responseSchema: schema, temperature: 0.2 } }));
  const busy = e => /429|500|503|RESOURCE_EXHAUSTED|UNAVAILABLE|INTERNAL|high demand|overloaded|quota|Failed to fetch|network|timed? ?out/i.test(String(e && e.message || e));
  const CATS_ = ["Produce", "Meat & Seafood", "Dairy & Eggs", "Bakery", "Frozen", "Pantry", "Spices", "Other"];
  const recipeSchema = Schema.object({ properties: {
    name: Schema.string(), serves: Schema.integer(), time: Schema.string(),
    ingredients: Schema.array({ items: Schema.object({ properties: {
      quantity: Schema.number(),
      unit: Schema.enumString({ enum: ["lb","oz","cup","tbsp","tsp","can","clove","jar","bag","box","pkg","head","bunch","slice","stalk","pinch","each"] }),
      item: Schema.string(),
      section: Schema.enumString({ enum: CATS_ }) } }) }),
    prep: Schema.array({ items: Schema.string() }),
    steps: Schema.array({ items: Schema.string() }),
    error: Schema.string()
  }, optionalProperties: ["serves", "time", "prep", "error"] });
  const readerCfg = { tools: [{ urlContext: {} }], generationConfig: { temperature: 0.1, responseMimeType: "application/json", responseSchema: recipeSchema } };
  const reader = getGenerativeModel(ai, { model: "gemini-3.5-flash", ...readerCfg });
  const reader2 = getGenerativeModel(ai, { model: "gemini-3.5-flash-lite", ...readerCfg });
  const reader3 = getGenerativeModel(ai, { model: "gemini-3.8-flash", ...readerCfg });
  window.importRecipeFromUrl = async (url, cats, pasted, images) => {
    const prompt = `${images ? "These photos show a recipe: a recipe card, a cookbook page, or a screenshot from a website or social media post. If several photos are given they are parts of the same recipe. Read it." : pasted ? `Here is a recipe the user copied from a web page${url ? " (" + url + ")" : ""}:\n"""\n${pasted.slice(0, 20000)}\n"""\nRead it.` : `Read the recipe at this link: ${url}`}
Give the recipe's name, servings, total time (like "45 min"), ingredients, make-ahead prep tasks and cooking steps.
Rules:
- item: a short generic grocery name in lowercase without prep words or sizes (e.g. "onion" not "1 medium onion, chopped"; "diced tomatoes" for a can of diced tomatoes; "chicken breast").
- Convert to the allowed units; use "each" for counted things (eggs, onions, peppers). For canned goods use "can" with the count. Fractions as decimals.
- Skip water, and skip salt and pepper "to taste".
- prep: up to 3 short make-ahead tasks someone could do earlier in the week (chopping, marinating, making a sauce). Empty if none.
- steps: the cooking steps, each one or two sentences, in order. Keep any temperatures and times.
- If the page is not a recipe or can't be read, set "error" to a short reason and leave the lists empty.`;
    let r, last;
    for (const m of [reader, reader2, reader3]) {
      try { r = await m.generateContent(images ? [{ text: prompt }, ...images.map(d => ({ inlineData: { mimeType: "image/jpeg", data: d } }))] : prompt); break; } catch (e) { last = e; console.warn("import failed", e); if (!busy(e)) throw e; }
    }
    if (!r) throw last;
    const t = r.response.text();
    try { return JSON.parse(t); }
    catch (e) { const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a < 0 || b < a) throw new Error("Couldn't read a recipe from that page."); return JSON.parse(t.slice(a, b + 1)); }
  };
  const ideaSchema = Schema.object({ properties: { recipes: Schema.array({ items: Schema.object({ properties: {
    name: Schema.string(), serves: Schema.integer(), time: Schema.string(), why: Schema.string(),
    ingredients: recipeSchema.properties.ingredients,
    prep: Schema.array({ items: Schema.string() }), steps: Schema.array({ items: Schema.string() })
  }, optionalProperties: ["prep", "why"] }) }) } });
  const ideaModels = ["gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.8-flash"].map(m => getGenerativeModel(ai, { model: m,
    generationConfig: { temperature: 0.9, responseMimeType: "application/json", responseSchema: ideaSchema } }));
  window.suggestRecipes = async ({ meal, diet, avoid, note, pantry, skip }) => {
    const prompt = `Write 3 ORIGINAL, family-friendly ${meal} recipes for a home cook on a busy weeknight${meal === "dinner" ? "" : " or morning"}. Serves 4.
Diet: ${diet}.${avoid.length ? `
Never use any of these (allergies or dislikes; also avoid ingredients that contain them): ${avoid.join(", ")}.` : ""}
${note ? `The family asked for: ${note}
` : ""}Prefer ingredients they already have: ${pantry.join(", ") || "(unknown)"}. Each recipe may add a few common grocery items.
Don't repeat these recipes they already have: ${skip.join("; ")}.
Rules:
- Make the 3 recipes clearly different from each other (protein, cuisine or cooking method). Total time 45 minutes or less unless asked otherwise.
- item: a short generic grocery name in lowercase with no prep words or sizes ("onion", "chicken breast", "diced tomatoes", "shredded cheddar").
- Use the allowed units; "each" for counted things; canned goods as "can". Skip water, salt and pepper.
- prep: up to 2 short make-ahead tasks (chopping, a sauce, marinating). steps: 3 to 6 clear steps with temperatures and times.
- why: one short sentence on why it suits this family (e.g. "Uses your rice and black beans").`;
    let r, last;
    for (const m of ideaModels) {
      try { r = await m.generateContent(prompt); break; } catch (e) { last = e; console.warn("suggest failed", e); if (!busy(e)) throw e; }
    }
    if (!r) throw last;
    const t = r.response.text();
    let j; try { j = JSON.parse(t); } catch (e) { const a = t.indexOf("{"), b = t.lastIndexOf("}"); j = JSON.parse(t.slice(a, b + 1)); }
    return j.recipes || [];
  };
  window.scanPantryPhotos = async (images, hint, vocab) => {
    const prompt = `You are taking inventory of a home kitchen from photos (fridge, freezer, pantry shelves, spice rack).
List every distinct food, drink, condiment, baking or cooking ingredient you can identify across ALL photos.
Rules:
- One entry per kind of item; merge duplicates across photos. Ignore quantities, containers, non-food and brand-only packaging you can't identify.
- Use short generic grocery names in lowercase (e.g. "black beans", "shredded cheddar", "chicken broth", "tortilla chips"). Keep a brand only when it's how people shop for it (e.g. "Tostitos tortilla chips").
- When an item matches one of these names the household cooks with, use that exact wording: ${vocab.join(", ")}.
- location: where it is stored. ${hint ? `All photos show the ${hint}, so use "${hint}" unless an item is clearly a spice or seasoning.` : "Infer from the photo (fridge interior, freezer, shelf/cabinet, spice rack)."} Dried herbs, spices, and seasoning blends go in "Spices".
- quantity: count + container + package size when you can read or estimate it, in exactly this style: "1 jar (16 oz)", "2 cans (15 oz)", "1 jug (1 gal)", "1 bag (2 lb)", "1 carton (32 oz)", "12 ct" for counted things like eggs, tortillas or loose produce. Combine the same item across photos into one count. Leave it out if you truly can't tell.
- remaining: how much is left in the package being used: "full" if sealed or full, "most" (about 3/4), "half", "low" (about 1/4), "empty" (nearly gone). For see-through containers (milk jugs, jars, bags) judge the level you can see. Use "unknown" ONLY when the container is clearly opened (lid off, torn, clipped, partly used) but you can't see how much is inside. If you can't tell whether it was opened, use "full". For several of the same item, judge the opened one.
- confidence: "low" if you are guessing from a partial or blurry view, otherwise "high".`;
    const parts = [{ text: prompt }, ...images.map(d => ({ inlineData: { mimeType: "image/jpeg", data: d } }))];
    let r, last;
    for (const model of [models[0], ...models]) {
      try { r = await model.generateContent(parts); break; }
      catch (e) { last = e; console.warn("scan model failed", e); if (!busy(e)) throw e; }
    }
    if (!r) throw last;
    let t = r.response.text().trim().replace(/^```(json)?/i, "").replace(/```$/, "");
    const j = JSON.parse(t);
    return Array.isArray(j) ? j : (j.items || []);
  };
}
