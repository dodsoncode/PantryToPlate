<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6a4d">
<meta name="description" content="Weekly dinner planner: pantry check, shopping list, prep and cooking steps.">
<title>Pantry to Plate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a four-step kitchen workflow (Pantry → Plan → Shop → Prep & cook) as numbered tabs over a single working column; lists read like a grocery ticket. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --sunk:#e4eae5; --ink:#1b241f; --muted:#5a6a61; --line:#d3dcd5;
  --accent:#2c6a4d; --accent-ink:#ffffff; --accent-soft:#d9ebe1;
  --mark:#e7b23a; --need:#b0502a; --need-soft:#f6e3d9;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --sunk:#141b17; --ink:#e5ece7; --muted:#9aaaa1; --line:#2b3730;
  --accent:#6fc59c; --accent-ink:#0d1812; --accent-soft:#1f3a2c;
  --mark:#e6b64e; --need:#e98d62; --need-soft:#3a241a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --sunk:#141b17; --ink:#e5ece7; --muted:#9aaaa1; --line:#2b3730;
  --accent:#6fc59c; --accent-ink:#0d1812; --accent-soft:#1f3a2c;
  --mark:#e6b64e; --need:#e98d62; --need-soft:#3a241a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
#acct{display:flex;align-items:center;gap:10px;font-size:.85rem;flex-wrap:wrap}
#acct .who{color:var(--muted)}
#acct .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px}
#acct .dot.off{background:var(--mark)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-block:24px 16px}
header.top p{margin:4px 0 0}
.serv{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.serv b{font-family:var(--f-mono);min-width:1.6em;text-align:center}
.round{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font-size:1.1rem;cursor:pointer;line-height:1}

.modes{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);margin-bottom:4px;max-width:100%}
.modes button{border:0;background:transparent;color:var(--muted);font:700 .9rem var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nextbar{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:8px;background:var(--bg);border-top:1px solid var(--line)}
.nextwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
button.btn.big{padding:12px 20px;font-size:1rem}
button.btn:disabled{opacity:.45;cursor:default}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
@media (max-width:440px){nav.tabs button{padding:6px 10px 6px 6px;font-size:.85rem;gap:6px}nav.tabs button .c{display:none}}
.hh{display:grid;gap:10px;margin-bottom:12px}
.hh .code{display:flex;align-items:baseline;gap:12px;background:var(--sunk);border-radius:8px;padding:10px 14px}
.hh .code b{font-size:1.3rem;letter-spacing:.08em}
button.btn.warn{border-color:var(--need);color:var(--need)}
#acct .link{font-size:.85rem}
.choose{display:grid;gap:22px;justify-items:center;text-align:center;padding-block:clamp(32px,10vh,90px)}
.choose h2{font-size:1.5rem;max-width:22ch}
.choices{display:grid;gap:12px;width:100%;max-width:440px}
.choice{display:grid;gap:4px;text-align:left;padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.choice b{font:700 1.15rem var(--f-display)}
.choice span{color:var(--muted);font-size:.92rem}
.choice:hover{border-color:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;overflow-x:auto}
nav.tabs .row{display:flex;gap:6px;min-width:max-content}
nav.tabs button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 8px;font:700 .95rem var(--f-body);cursor:pointer}
nav.tabs button .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .8rem var(--f-mono)}
nav.tabs button .c{font:500 .75rem var(--f-mono);color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button[aria-selected="true"] .n{background:var(--accent-ink);color:var(--accent)}
nav.tabs button[aria-selected="true"] .c{color:var(--accent-ink);opacity:.8}

main{display:grid;gap:20px;padding-top:12px}
section.block{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.head-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}

button.btn,label.btn,a.btn{font:700 .9rem var(--f-body);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.link{background:none;border:0;padding:0;color:var(--accent);font:700 .875rem var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button.warn{border-color:var(--need);color:var(--need)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input[type=text],select,textarea,input[type=number]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical}
.form{display:flex;flex-wrap:wrap;gap:8px}
.form input[type=text]{flex:1 1 200px}
details>summary{cursor:pointer;font-weight:700;color:var(--accent)}
details[open]>summary{margin-bottom:10px}

/* pantry */
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.loc h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 11px;font-size:.9rem}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1}
.chip button:hover{background:var(--line);color:var(--ink)}
.empty{color:var(--muted);font-size:.9rem;font-style:italic}

/* meter */
.meter{display:flex;align-items:center;gap:8px;font-size:.85rem}
.bar{flex:0 0 90px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}

/* plan */
.week{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dn{font:700 .95rem var(--f-display)}
.day select{width:100%}
.pill{font:500 .75rem var(--f-mono);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.buy{background:var(--need-soft);color:var(--need)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.card .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.missing{font-size:.85rem;color:var(--need)}
.card .actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:700 .85rem var(--f-body);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ingredient + ticket lists */
.ing{list-style:none;margin:0;padding:0;display:grid}
.ing li{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.ing li:last-child{border-bottom:0}
.ing .q{font-family:var(--f-mono);font-size:.85rem;text-align:right;color:var(--muted)}
.ing .h{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ing .h.ok{color:var(--accent)} .ing .h.buy{color:var(--need)}
ol.steps{margin:0;padding-left:1.4rem;display:grid;gap:6px}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 12px}
.aisle{padding-top:12px}
.aisle .eyebrow{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:2px}
.check{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.check .for{display:block;font-size:.78rem;color:var(--muted)}
.check .q{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wm{font:700 .75rem var(--f-body);color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.wm:hover{background:var(--accent-soft)}
.check.done .t{text-decoration:line-through;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.9rem}
.stats b{font-family:var(--f-mono)}

/* prep */
.prepday{border-left:4px solid var(--mark);padding-left:12px}
.cook{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.cook .ttl{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}.day{grid-template-columns:48px minmax(0,1fr)}.day .pill{grid-column:2;justify-self:start}}

.scanlist{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.scanrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.scanmeta{grid-column:2 / -1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr);gap:6px}
@media (max-width:520px){.scanmeta{grid-template-columns:1fr 1fr}.scanmeta input{grid-column:1 / -1}}
.chip .amt{font:500 .75rem var(--f-mono);color:var(--muted);margin-left:6px}
.chip.low{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 14%,var(--sunk))}
.lownote{background:color-mix(in srgb,var(--mark) 18%,var(--surface))}
.scanrow:first-child{border-top:0}
.scanrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.scanrow input[type=text],.scanrow select{padding:6px 8px;width:100%}
.scanrow.off input[type=text]{color:var(--muted);text-decoration:line-through}
.scanrow .pill{justify-self:start}
.scanwait{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.9rem}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.scanerr{background:var(--need-soft);color:var(--need);border-radius:8px;padding:10px 14px;font-size:.9rem;font-weight:700}
label.btn{display:inline-flex;align-items:center}
.icready{align-items:center}
.icready a.btn{text-decoration:none;display:inline-flex}
.storebox{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.storebox a.btn,.pick a.btn{justify-self:start}
.pick{display:grid;gap:12px;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:14px 16px;scroll-margin-top:70px}
.pickstore{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.pickstore a{color:var(--accent)}
.plist{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.on{background:var(--accent-soft)}
.prow>span{min-width:0}
.check .pickbtn{font-size:.72rem;font-weight:500;color:var(--muted)}
.wm.set{background:var(--accent-soft)}
label.btn.ghost{background:transparent;color:var(--accent)}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rate button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:3px 10px;font:600 .8rem var(--f-body);cursor:pointer}
.rate .star.on{background:var(--mark);border-color:var(--mark);color:#1b241f}
.rate .who.up{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rate .who.down{background:var(--need-soft);border-color:var(--need);color:var(--need)}
.family{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.family input{flex:1 1 200px}
#cookSheet select{max-width:48%}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:10px;font-weight:700;font-size:.95rem;z-index:30;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;min-height:44px}
.toast button{border:0;background:transparent;color:var(--bg);font:700 .95rem var(--f-body);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 10px;cursor:pointer}
body.cooking .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}

/* ===== 2026-10 redesign: bottom tabs, Today, bigger targets, sheets, cook mode ===== */
:root{--tabh:58px}
html{-webkit-text-size-adjust:100%}
body{font-size:1rem;padding-bottom:calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
header.top{padding-block:10px 6px;align-items:center;flex-wrap:nowrap}
#acct{flex:0 1 auto;justify-content:flex-end;text-align:right}
@media (max-width:380px){header.top h1{font-size:1.15rem}}
header.top h1{font-size:1.35rem}
button.btn,label.btn,a.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;font-size:.95rem;text-decoration:none}
button.link{min-height:44px;padding:0 4px}
.round{width:44px;height:44px}
input[type=text],input[type=url],input[type=search],select,textarea,input[type=number]{min-height:44px;font-size:1rem}
input[type=url],input[type=search]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 200px}
.backrow{display:flex;align-items:center;gap:8px;margin-bottom:-6px}
.backrow button{min-height:44px;border:0;background:none;color:var(--accent);font:700 1rem var(--f-body);padding:0 8px 0 0;cursor:pointer}

/* bottom tab bar (HIG: main sections at the bottom, icon + short label) */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .row{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto}
nav.tabbar button{position:relative;height:var(--tabh);border:0;background:none;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:2px;font:700 .72rem var(--f-body);cursor:pointer;padding:0}
nav.tabbar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button[aria-current="page"]{color:var(--accent)}
nav.tabbar .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--need);color:#fff;font:700 .68rem/18px var(--f-body);padding:0 5px}
body.cooking nav.tabbar,body.cooking header.top{display:none}

/* segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:700 .95rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Today */
.tonight{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:18px;display:grid;gap:10px}
.tonight h2{font-size:1.6rem}
.tonight .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tonight .btn.big{padding:14px 22px;font-size:1.05rem}
.nudges{display:grid;gap:8px}
.nudge{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.nudge .ic{font-size:1.2rem;text-align:center}
.nudge.warm{background:color-mix(in srgb,var(--mark) 14%,var(--surface));border-color:color-mix(in srgb,var(--mark) 45%,var(--line))}
.weekstrip{display:grid;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.wrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:52px;padding:6px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}
.wrow:first-child{border-top:0}
.wrow .dn{font:700 .9rem var(--f-display);color:var(--muted)}

/* Kitchen */
.addbox{display:grid;gap:8px}
.addbox .form input[type=text]{flex:1 1 180px}

.filters button{min-height:44px;padding:6px 14px}

.loclist:not([open])>summary::after{transform:none}
.items{display:grid}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center;min-height:48px;border-top:1px solid var(--line)}
.item .nm{min-width:0}
.item .amt{display:block;font-size:.8rem;color:var(--muted)}
.item.low .nm b{color:var(--need)}
.item button{min-width:44px;min-height:44px;border:0;background:none;border-radius:8px;color:var(--muted);font:700 .8rem var(--f-body);cursor:pointer}
.item button:hover{background:var(--sunk);color:var(--ink)}
.item button.on{color:var(--need)}
.item button.x{font-size:1.3rem;font-weight:400}

.daybtn{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:60px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}

/* ---------- cloud shape ----------
   The shared copy is saved field by field (one pantry item, one checkmark, one night of the plan)
   so two phones editing at the same time don't overwrite each other.
   Lists of things with ids are stored as maps keyed by id (pantryM, extrasM, customM). */
const LOCAL=["tab","mode","now","storeTab","krMode","cook","planView","order","kOpen"];
const LISTF=["pantry","extras","custom"];
const MAPF=["plan","checked","checkedBy","done","buyAnyway","fav","ratings","products","cookLog","cooked"];
const SEP="\u0001";
function toCloud(s){const c={};Object.keys(s).forEach(k=>{if(LOCAL.includes(k)||s[k]===undefined)return;
  if(LISTF.includes(k)&&Array.isArray(s[k])){const m={};s[k].forEach(it=>{if(it&&it.id)m[it.id]=it});c[k+"M"]=m}
  else c[k]=s[k]});return JSON.parse(JSON.stringify(c))}
function fromCloud(c){c=c||{};const s={};Object.keys(c).forEach(k=>{
  const base=k.endsWith("M")&&LISTF.includes(k.slice(0,-1))?k.slice(0,-1):null;
  if(base)s[base]=Object.values(c[k]||{}).filter(x=>x&&x.id).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  else if(LISTF.includes(k)){if(!c[k+"M"]&&Array.isArray(c[k]))s[k]=c[k]}
  else s[k]=c[k]});
  LISTF.forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});return s}
const isMapField=k=>MAPF.includes(k)||(k.endsWith("M")&&LISTF.includes(k.slice(0,-1)));
function flat(c){const f={};Object.keys(c).forEach(k=>{const v=c[k];
  if(isMapField(k)&&v&&typeof v==="object"&&!Array.isArray(v))Object.keys(v).forEach(x=>{if(v[x]!==undefined)f[k+SEP+x]=JSON.stringify(v[x])});
  else if(v!==undefined)f[k]=JSON.stringify(v)});return f}
function unflat(f){const c={};Object.keys(f).forEach(p=>{const i=p.indexOf(SEP),v=JSON.parse(f[p]);
  if(i<0)c[p]=v;else{const k=p.slice(0,i);if(!c[k]||typeof c[k]!=="object"||Array.isArray(c[k]))c[k]={};c[k][p.slice(i+1)]=v}});return c}

function sing(w){if(w.length>4&&w.endsWith("ies"))return w.slice(0,-3)+"y";if(w.endsWith("oes"))return w.slice(0,-2);if(w.length>3&&w.endsWith("s")&&!w.endsWith("ss"))return w.slice(0,-1);return w}
const norm=n=>n.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(sing);
const sub=(a,b)=>a.every(t=>b.includes(t));
function matches(a,b){const x=norm(a),y=norm(b);if(!x.length||!y.length)return false;if(x.join(" ")===y.join(" "))return true;return x[x.length-1]===y[y.length-1]&&(sub(x,y)||sub(y,x))}

function status(r){const rows=r.ing.map(i=>({q:i[0],u:i[1],n:i[2],cat:i[3],have:have(i[2])}));const got=rows.filter(x=>x.have).length;return{rows,got,total:rows.length,missing:rows.filter(x=>!x.have)}}

const WHOLE=["each","clove","can","jar","bag","box","pkg","head","bunch","slice","stalk","tub"];
const PL={cup:"cups",clove:"cloves",can:"cans",jar:"jars",bag:"bags",box:"boxes",pkg:"pkgs",head:"heads",bunch:"bunches",slice:"slices",stalk:"stalks",tub:"tubs"};
function fq(q,u){
  if(WHOLE.includes(u)){const n=Math.max(1,Math.ceil(q-0.05));return u==="each"?String(n):n+" "+(n>1&&PL[u]?PL[u]:u)}
  let r=Math.round(q*4)/4;if(r===0)r=0.25;const i=Math.floor(r),f={0.25:"¼",0.5:"½",0.75:"¾"}[r-i]||"";
  return (i||!f?i:"")+f+" "+(r>1&&PL[u]?PL[u]:u);
}
const scale=(q,r)=>q*S.servings/r.serves;
function planned(){return DAYS.map(([k,l])=>({k,l,r:S.plan[k]?byId(S.plan[k]):null})).filter(d=>d.r)}
/* Everything being cooked: the week's dinners plus a "hungry now" pick. */
function active(){const r=S.now&&byId(S.now);const p=planned();return r&&!p.some(d=>d.r.id===r.id)?[{k:"now",l:"Tonight",r}].concat(p):p}
const DK=["sun","mon","tue","wed","thu","fri","sat"];
const todayKey=()=>DK[new Date().getDay()];
const tomorrowKey=()=>DK[(new Date().getDay()+1)%7];
const dayName=k=>(DAYS.find(d=>d[0]===k)||[k,k])[1];
const isCooked=k=>{const d=S.cooked&&S.cooked[k];return !!d&&daysAgo(d)<7};

function shopping(){
  const map={};
  active().forEach(d=>d.r.ing.forEach(([q,u,n,cat])=>{
    const key=norm(n).join(" ")+"|"+u;
    if(!map[key])map[key]={key,n,u,cat,q:0,for:new Set()};
    map[key].q+=scale(q,d.r);map[key].for.add(d.k==="now"?"tonight":d.l.slice(0,3));
  }));
  const items=Object.values(map);
  const need=items.filter(i=>!have(i.n)||S.buyAnyway[i.key]);
  const onHand=items.filter(i=>have(i.n)&&!S.buyAnyway[i.key]);
  return{need,onHand};
}

    <label class="btn ghost" for="scanFiles" role="button" tabindex="0">📷 Scan</label><input type="file" id="scanFiles" accept="image/*" multiple hidden></span></section>`;
  return `<section class="block panel">

    <div class="form">

function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.8).split(",")[1])};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("One of the photos couldn't be opened. Try taking it again."))};img.src=url})}
async function runScan(files){
  const hint=(document.getElementById("scanLoc")||{}).value||"";
  files=[...files].slice(0,10);if(!files.length)return;
  if(!window.scanPantryPhotos){SCAN={status:"error",items:SCAN.items,n:0,msg:"Photo scanning isn't turned on yet. It needs Firebase AI Logic enabled for this project."};render(true);return}
  const prev=SCAN.status==="review"?SCAN.items:[];
  SCAN={status:"working",items:prev,n:files.length,msg:""};render(true);
  try{
    const imgs=await Promise.all(files.map(shrink));
    const vocab=[...new Set(all().flatMap(r=>r.ing.map(i=>i[2].toLowerCase())))];
    const found=await window.scanPantryPhotos(imgs,hint,vocab);
    const merged=[...prev];
    found.forEach(f=>{const name=String(f.name||"").trim().toLowerCase();if(!name)return;
      if(merged.some(m=>norm(m.name).join(" ")===norm(name).join(" ")))return;
      const loc=LOCS.includes(f.location)?f.location:(hint||"Pantry");
      const dup=!!findItem(name);const left=LVLS.some(([k])=>k===f.remaining)&&f.remaining!=="unknown"?f.remaining:"";
      merged.push({name,loc,dup,qty:String(f.quantity||"").trim(),left,unsure:f.confidence==="low",on:f.confidence!=="low"})});
    SCAN={status:merged.length?"review":"error",items:merged,n:0,msg:merged.length?"":"No food was recognized. Try closer photos with better light."};
  }catch(err){console.error(err);SCAN={status:prev.length?"review":"error",items:prev,n:0,msg:scanErr(err)};if(prev.length)toast(scanErr(err))}
  render(true);
}
function scanErr(err){const m=String(err&&err.message||err);
  if(/api.*not.*enabled|PERMISSION_DENIED|403|has not been used|API_NOT_ENABLED/i.test(m))return "Photo scanning isn't turned on yet. Enable AI Logic in the Firebase console (AI Services → AI Logic → Get started → Gemini Developer API).";
  if(/quota|429|RESOURCE_EXHAUSTED|high demand|overloaded|500|503/i.test(m))return "The scanning service is busy right now. Wait a minute and try again.";
  if(/network|fetch/i.test(m))return "Couldn't reach the scanning service. Check your connection and try again.";
  return m.length<160?m:"The scan didn't finish. Try again with fewer photos.";}

const daysAgo=d=>d?Math.floor((Date.now()-new Date(d+"T12:00:00"))/864e5):null;
function score(r,s){s=s||status(r);let v=(S.fav||{})[r.id]?3:0;const rt=(S.ratings||{})[r.id]||{};
  Object.values(rt).forEach(x=>v+=x>0?1:-2);v-=s.missing.length*0.6;const d=daysAgo((S.cookLog||{})[r.id]);if(d!==null&&d<14)v-=3*(14-d)/14;return v}

async function runImport(url,pasted,images){
  url=(url||"").trim();
  if(images){url=""}
  else if(pasted){if(pasted.trim().length<40){toast("Paste the ingredients and directions first");return}}
  else if(!/^https?:\/\/\S+\.\S+/.test(url)){toast("Paste a full link that starts with https://");return}
  if(!window.importRecipeFromUrl){IMP={status:"error",url,r:null,msg:"Recipe import isn't available right now. Reload the page and try again."};render(true);return}
  IMP={status:"working",url,r:null,msg:""};render(true);
  if(images&&!images.length){IMP={status:"idle",url:"",r:null,msg:""};render(true);return}
  try{const j=await window.importRecipeFromUrl(url,CATS,pasted||"",images||null);
    if(!j||!Array.isArray(j.ingredients)||!j.ingredients.length)throw new Error((j&&j.error?j.error+" ":"No recipe was found. ")+(images?"Try a clearer photo that shows the ingredients.":pasted?"":"Try pasting the recipe text below."));
    const ing=j.ingredients.map(x=>{const u=UNIT_OK.includes(String(x.unit||"").toLowerCase())?String(x.unit).toLowerCase():"each";const q=+x.quantity>0?+x.quantity:1;
      const n=String(x.item||"").trim().toLowerCase();return [q,u,n,CATS.includes(x.section)?x.section:guess(n)]}).filter(x=>x[2]);
    let host="";try{host=new URL(url).hostname.replace(/^www\./,"")}catch(e){}
    if(!url)url="";
    IMP={status:"review",url,msg:"",r:{name:String(j.name||"Imported recipe").trim(),serves:Math.max(1,Math.round(+j.serves||4)),time:String(j.time||"").trim(),
      ing,prep:(j.prep||[]).map(String).filter(Boolean),steps:(j.steps||[]).map(String).filter(Boolean),source:url?{label:host||"link",url}:null}};
  }catch(err){console.error(err);IMP={status:"error",url,r:null,msg:/busy|quota|429|500|503|demand|Failed to fetch|network/i.test(String(err.message))?"The import service is busy (or the connection dropped). Wait a minute and try again.":String(err.message||err).slice(0,200)}}
  render(true);
}

  const n=m[1].includes("/")?+m[1].split("/")[0]/+m[1].split("/")[1]:+m[1];const w=(m[2]||"").toLowerCase();return{n,w,u:w?(UA[w]||UA[sing(w)]||null):"each",rest:String(t).trim().slice(m[0].length)}}
const nice=x=>Math.round(x*100)/100;
const CONV={"cup>can":1/1.75,"can>cup":1.75,"lb>oz":16,"oz>lb":1/16,"cup>tbsp":16,"tbsp>cup":1/16,"tbsp>tsp":3,"tsp>tbsp":1/3,"cup>tsp":48,"tsp>cup":1/48,"oz>can":1/14.5,"can>oz":14.5};

    if(p.loc==="Spices"||cat==="Spices"){row.choice="keep"}

      const cv=pq&&pq.u?conv(need,u,pq.u):null;
      if(pq&&pq.u&&(cv!==null||(PACK.includes(u)&&pq.u==="each"&&!pq.w))){const use=pq.u===u&&PACK.includes(u)?storeQty(need,u):cv!==null?(PACK.includes(pq.u)?Math.ceil(cv-0.05):cv):storeQty(need,u),left=nice(pq.n-use);
        if(left<=0.01)row.choice="out";else{const w=pq.w&&left===1&&/s$/.test(pq.w)?pq.w.slice(0,-1):pq.w;row.qty=(left+" "+(w||"")+pq.rest).replace(/\s+/g," ").trim()}}
      else{const L=["full","most","half","low","empty"],i=Math.max(0,L.indexOf(p.left||"full"));if(i>=3)row.choice="out";else{row.left=L[i+1];if(i+1>=3)row.choice="low"}}}

    nav=`<button class="btn ghost" data-act="cookClose">Later</button><button class="btn" data-act="cookStep" data-d="1">Start: step 1 →</button>`;

  }
  return `<div class="cookmode">${top}${body}</div><div class="cooknav">${nav}</div>`;
};

  if(f.id==="extraForm"){const n=document.getElementById("extraName").value.trim();if(!n)return;S.extras.push({id:nid(),name:n});render();document.getElementById("extraName").focus()}
  if(f.id==="recForm"){const name=document.getElementById("rName").value.trim();const ing=lines(document.getElementById("rIng").value).map(parseIng).filter(x=>x[2]);const steps=lines(document.getElementById("rSteps").value);
    if(!name||!ing.length||!steps.length){toast("Add a name, at least one ingredient and one step");return}
    S.custom.push({id:"c"+nid(),custom:true,name,serves:Math.max(1,+document.getElementById("rServes").value||4),time:document.getElementById("rTime").value.trim(),tags:[],ing,prep:lines(document.getElementById("rPrep").value),steps});render();toast("Recipe saved")}
});
render();
</script>
<script>
/* Cloud sync: Google sign-in + Firestore.
   Personal planner: pantryToPlate/{uid}.state
   Shared household:  households/{code}.state, members [uid...]; pantryToPlate/{uid}.household = code
   Mode, current step and "hungry now" pick stay per person. */
(function(){
  const el=document.getElementById("acct"), hh=document.getElementById("hh");
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase){el.innerHTML='<span class="who">Saved on this device</span>';return}
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue;
  const FP=firebase.firestore.FieldPath;
  let user=null,userRef=null,ref=null,unsub=null,timer=null,lastF=null,house=null,hdata=null,panelOpen=false,leaveArm=false,syncState="sync";
  const joinParam=(new URLSearchParams(location.search).get("join")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const first=()=>user&&user.displayName?user.displayName.split(" ")[0]:"Someone";
  const fmt=c=>c.slice(0,5)+"-"+c.slice(5);
  const newCode=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";const r=crypto.getRandomValues(new Uint32Array(10));r.forEach(n=>c+=A[n%A.length]);return c};
  const inviteLink=c=>location.origin+location.pathname+"?join="+c;

  function show(){
    if(!user){el.innerHTML='<button class="btn ghost" data-acct="in">Sign in to sync &amp; share</button>';hh.hidden=true;return}
    const n=hdata&&hdata.members?hdata.members.length:0;
    const status=syncState==="err"?'<span class="dot off"></span>Sync paused':syncState==="sync"?'<span class="dot off"></span>Syncing…':`<span class="dot"></span>${house?`Shared · ${n} ${n===1?"person":"people"}`:"Synced · "+esc(first())}`;
    el.innerHTML=`<button class="link" data-acct="hh" aria-expanded="${panelOpen}" style="text-decoration:none;color:var(--muted);font-weight:500">${status} ›</button>`;
    hh.hidden=!panelOpen;if(panelOpen)hh.innerHTML=panel();
  }
  function panel(){
    if(house){
      const names=hdata&&hdata.names?Object.values(hdata.names):[];
      return `<div class="head-row"><h3>Your household</h3><button class="link" data-acct="close">Close</button></div>
      <p class="small" style="margin:0">Everyone here shares the same pantry, week plan, store list and recipes${names.length?`: <b>${names.map(esc).join(", ")}</b>`:""}.</p>
      <div class="code"><span class="small muted">Invite code</span><b class="mono">${fmt(house)}</b></div>
      <div class="form"><button class="btn" data-acct="invite">Send invite</button><button class="btn ghost ${leaveArm?"warn":""}" data-acct="leave">${leaveArm?"Tap again to leave":"Leave household"}</button></div>
      <p class="small muted" style="margin:0">To add someone: send the invite, have them open it and sign in with their own Google account. Check-offs show the first letter of who checked them.</p>
      <div><button class="link" data-acct="out">Sign out</button></div>`;
    }
    return `<div class="head-row"><h3>Share with your household</h3><button class="link" data-acct="close">Close</button></div>
    <p class="small" style="margin:0">Start a household to share one pantry, plan and store list with the people you live with. Each person signs in with their own Google account.</p>
    <div class="form"><button class="btn" data-acct="create">Start a household</button></div>
    <div class="form"><input type="text" id="joinCode" placeholder="Have a code? e.g. ABCDE-FGHJK" value="${joinParam?fmt(joinParam):""}" autocomplete="off" aria-label="Household invite code" style="text-transform:uppercase"><button class="btn ghost" data-acct="join">Join</button></div>
    <p class="small muted" style="margin:0">Joining shows the household's planner. Your own planner is kept and comes back if you leave.</p>
    <div><button class="link" data-acct="out">Sign out</button></div>`;
  }

  el.addEventListener("click",onClick);hh.addEventListener("click",onClick);
  async function onClick(e){
    const b=e.target.closest("[data-acct]");if(!b)return;const a=b.dataset.acct;
    if(a==="in"){const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(err=>{if(/popup/.test(err.code||""))auth.signInWithRedirect(p);else toast("Sign-in didn't finish. Try again.")});return}
    if(a==="out"){auth.signOut();return}
    if(a==="hh"){panelOpen=!panelOpen;leaveArm=false;show();return}
    if(a==="close"){panelOpen=false;show();return}
    if(a==="create"){b.disabled=true;
      try{const code=newCode();const current=toCloud(S);
        await db.collection("households").doc(code).set({members:[user.uid],names:{[user.uid]:first()},state:current,created:FV.serverTimestamp()});
        await userRef.set({household:code},{merge:true});await attach(code);toast("Household started. Send the invite to add people.");
      }catch(err){console.error(err);toast(permMsg(err));b.disabled=false}return}
    if(a==="join"){const code=(document.getElementById("joinCode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(code.length!==10){toast("Codes are 10 letters and numbers, like ABCDE-FGHJK.");return}
      b.disabled=true;
      try{await db.collection("households").doc(code).update({members:FV.arrayUnion(user.uid),["names."+user.uid]:first()});
        await userRef.set({household:code},{merge:true});await attach(code);
        if(joinParam)history.replaceState(null,"",location.pathname);toast("You joined the household.");
      }catch(err){console.error(err);toast(/not-found|NOT_FOUND|No document/i.test(String(err.code||err.message))?"That code wasn't found. Check it and try again.":permMsg(err));b.disabled=false}return}
    if(a==="invite"){const link=inviteLink(house),text=`Join our meal planner on Pantry to Plate: ${link}\n(Code: ${fmt(house)})`;
      if(navigator.share){try{await navigator.share({title:"Pantry to Plate household",text});return}catch(e){if(e&&e.name==="AbortError")return}}
      try{await navigator.clipboard.writeText(text);toast("Invite copied. Paste it in a text or email.")}catch(e){prompt("Copy this invite:",text)}return}
    if(a==="leave"){if(!leaveArm){leaveArm=true;show();return}
      try{const code=house;await db.collection("households").doc(code).update({members:FV.arrayRemove(user.uid),["names."+user.uid]:FV.delete()});
        await userRef.set({household:FV.delete()},{merge:true});leaveArm=false;await attach(null);toast("You left the household. Your own planner is back.");
      }catch(err){console.error(err);toast(permMsg(err))}return}
  }
  const permMsg=err=>/permission|PERMISSION_DENIED/i.test(String(err&&(err.code||err.message)))?"Household sharing isn't allowed yet. The Firestore rules need the households section.":"That didn't work. Check your connection and try again.";

  const legacy=st=>LISTF.some(k=>Array.isArray(st[k])&&!st[k+"M"]);
  const fpath=p=>{const i=p.indexOf(SEP);return i<0?new FP("state",p):new FP("state",p.slice(0,i),p.slice(i+1))};
  // Show the remote copy plus any of my changes that haven't been sent yet.
  function apply(st){
    const remoteF=flat(toCloud(Object.assign({},fromCloud(st))));
    const mineF=flat(toCloud(S));
    const base=lastF||remoteF;
    const mergedF=lastF?mergeFlat(base,mineF,remoteF):remoteF;
    lastF=remoteF;
    if(JSON.stringify(mergedF)!==JSON.stringify(mineF)){
      const keep={};LOCAL.forEach(k=>keep[k]=S[k]);
      S=Object.assign(defaults(),fromCloud(unflat(mergedF)),keep);
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
      render(true);
    }
    if(JSON.stringify(mergedF)!==JSON.stringify(remoteF))push();
  }
  // Send only the fields that changed since the last copy we saw.
  function push(){
    if(!ref||!lastF)return;
    const mineF=flat(toCloud(S)),d=fdiff(lastF,mineF);
    if(!d.set.length&&!d.del.length)return;
    const args=[];d.set.forEach(p=>args.push(fpath(p),JSON.parse(mineF[p])));d.del.forEach(p=>args.push(fpath(p),FV.delete()));
    args.push(new FP("updated"),FV.serverTimestamp());
    lastF=mineF;syncState="sync";show();
    ref.update(...args).then(()=>{syncState="in";show()}).catch(e=>{
      if(/not-found|NOT_FOUND|No document/i.test(String(e.code||e.message)))return ref.set({state:toCloud(S),updated:FV.serverTimestamp()},{merge:true}).then(()=>{syncState="in";show()});
      throw e}).catch(e=>{console.error(e);syncState="err";show()});
  }
  window.cloudPush=function(){if(!ref)return;clearTimeout(timer);timer=setTimeout(push,400)};
  async function attach(code){
    if(unsub){unsub();unsub=null}lastF=null;house=code;hdata=null;syncState="sync";show();
    ref=code?db.collection("households").doc(code):userRef;
    const snap=await ref.get();
    if(code)hdata=snap.data()||null;
    const st=snap.exists?snap.data().state:null;
    if(st&&legacy(st)){
      // One-time move from the old "whole planner" format to item-level fields.
      apply(st);await ref.update(new FP("state"),toCloud(S));lastF=flat(toCloud(S));
    }else if(st)apply(st);
    else{lastF={};await ref.set({state:toCloud(S),updated:FV.serverTimestamp()},{merge:true});lastF=flat(toCloud(S))}
    unsub=ref.onSnapshot(sn=>{
      if(!sn.exists){return}
      if(code){hdata=sn.data();if(!(hdata.members||[]).includes(user.uid)){attach(null);return}}
      if(sn.data().state)apply(sn.data().state);
      syncState="in";show();
    },e=>{console.error(e);syncState="err";show()});
    syncState="in";show();
  }

  auth.onAuthStateChanged(async u=>{
    if(unsub){unsub();unsub=null}user=u;ref=null;lastF=null;house=null;hdata=null;
    window.ME=u&&u.displayName?u.displayName.split(" ")[0]:"";
    if(!u){panelOpen=false;show();return}
    userRef=db.collection("pantryToPlate").doc(u.uid);
    try{const us=await userRef.get();const code=us.exists?us.data().household:null;
      if(joinParam&&!code)panelOpen=true;
      try{await attach(code||null)}catch(e){console.error(e);if(code){await attach(null)}else throw e}
    }catch(e){console.error(e);syncState="err";show()}
  });
})();
</script>
<script type="module">
/* Photo scan: Gemini via Firebase AI Logic (no API key in the page; uses this Firebase project). */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAI, getGenerativeModel, GoogleAIBackend, Schema } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey) {
  const app = initializeApp(cfg, "pantry-scan");
  const ai = getAI(app, { backend: new GoogleAIBackend() });
  const schema = Schema.object({ properties: { items: Schema.array({ items: Schema.object({ properties: {
    name: Schema.string(),
    location: Schema.enumString({ enum: ["Fridge", "Freezer", "Pantry", "Spices"] }),
    quantity: Schema.string(),
    remaining: Schema.enumString({ enum: ["full", "most", "half", "low", "empty", "unknown"] }),
    confidence: Schema.enumString({ enum: ["high", "low"] })
  }, optionalProperties: ["quantity"] }) }) } });
  // Tried in order; moves on when a model is busy or over its free-tier limit.
  const MODELS = ["gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-3.1-flash-lite"];
  const models = MODELS.map(m => getGenerativeModel(ai, { model: m,
    generationConfig: { responseMimeType: "application/json", responseSchema: schema, temperature: 0.2 } }));
  const busy = e => /429|500|503|RESOURCE_EXHAUSTED|UNAVAILABLE|INTERNAL|high demand|overloaded|quota|Failed to fetch|network|timed? ?out/i.test(String(e && e.message || e));
  const CATS_ = ["Produce", "Meat & Seafood", "Dairy & Eggs", "Bakery", "Frozen", "Pantry", "Spices", "Other"];
  const recipeSchema = Schema.object({ properties: {
    name: Schema.string(), serves: Schema.integer(), time: Schema.string(),
    ingredients: Schema.array({ items: Schema.object({ properties: {
      quantity: Schema.number(),
      unit: Schema.enumString({ enum: ["lb","oz","cup","tbsp","tsp","can","clove","jar","bag","box","pkg","head","bunch","slice","stalk","pinch","each"] }),
      item: Schema.string(),
      section: Schema.enumString({ enum: CATS_ }) } }) }),
    prep: Schema.array({ items: Schema.string() }),
    steps: Schema.array({ items: Schema.string() }),
    error: Schema.string()
  }, optionalProperties: ["serves", "time", "prep", "error"] });
  const readerCfg = { tools: [{ urlContext: {} }], generationConfig: { temperature: 0.1, responseMimeType: "application/json", responseSchema: recipeSchema } };
  const reader = getGenerativeModel(ai, { model: "gemini-3.5-flash", ...readerCfg });
  const reader2 = getGenerativeModel(ai, { model: "gemini-3.5-flash-lite", ...readerCfg });
  const reader3 = getGenerativeModel(ai, { model: "gemini-3.8-flash", ...readerCfg });
  window.importRecipeFromUrl = async (url, cats, pasted, images) => {
    const prompt = `${images ? "These photos show a recipe: a recipe card, a cookbook page, or a screenshot from a website or social media post. If several photos are given they are parts of the same recipe. Read it." : pasted ? `Here is a recipe the user copied from a web page${url ? " (" + url + ")" : ""}:\n"""\n${pasted.slice(0, 20000)}\n"""\nRead it.` : `Read the recipe at this link: ${url}`}
Give the recipe's name, servings, total time (like "45 min"), ingredients, make-ahead prep tasks and cooking steps.
Rules:
- item: a short generic grocery name in lowercase without prep words or sizes (e.g. "onion" not "1 medium onion, chopped"; "diced tomatoes" for a can of diced tomatoes; "chicken breast").
- Convert to the allowed units; use "each" for counted things (eggs, onions, peppers). For canned goods use "can" with the count. Fractions as decimals.
- Skip water, and skip salt and pepper "to taste".
- prep: up to 3 short make-ahead tasks someone could do earlier in the week (chopping, marinating, making a sauce). Empty if none.
- steps: the cooking steps, each one or two sentences, in order. Keep any temperatures and times.
- If the page is not a recipe or can't be read, set "error" to a short reason and leave the lists empty.`;
    let r, last;
    for (const m of [reader, reader2, reader3]) {
      try { r = await m.generateContent(images ? [{ text: prompt }, ...images.map(d => ({ inlineData: { mimeType: "image/jpeg", data: d } }))] : prompt); break; } catch (e) { last = e; console.warn("import failed", e); if (!busy(e)) throw e; }
    }
    if (!r) throw last;
    const t = r.response.text();
    try { return JSON.parse(t); }
    catch (e) { const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a < 0 || b < a) throw new Error("Couldn't read a recipe from that page."); return JSON.parse(t.slice(a, b + 1)); }
  };
  window.scanPantryPhotos = async (images, hint, vocab) => {
    const prompt = `You are taking inventory of a home kitchen from photos (fridge, freezer, pantry shelves, spice rack).
List every distinct food, drink, condiment, baking or cooking ingredient you can identify across ALL photos.
Rules:
- One entry per kind of item; merge duplicates across photos. Ignore quantities, containers, non-food and brand-only packaging you can't identify.
- Use short generic grocery names in lowercase (e.g. "black beans", "shredded cheddar", "chicken broth", "tortilla chips"). Keep a brand only when it's how people shop for it (e.g. "Tostitos tortilla chips").
- When an item matches one of these names the household cooks with, use that exact wording: ${vocab.join(", ")}.
- location: where it is stored. ${hint ? `All photos show the ${hint}, so use "${hint}" unless an item is clearly a spice or seasoning.` : "Infer from the photo (fridge interior, freezer, shelf/cabinet, spice rack)."} Dried herbs, spices, and seasoning blends go in "Spices".
- quantity: how much is there, as a short household phrase with count and package size when visible, e.g. "2 cans (15 oz)", "1 gallon jug", "1 bag, 32 oz", "6 eggs", "3 bell peppers", "1 jar". Combine counts across photos. Omit if you truly can't tell.
- remaining: how full the open or partly used container looks: "full" (sealed/unopened or full), "most", "half", "low" (about a quarter or less), "empty" (nearly gone), or "unknown" if you can't see the level. For several of the same item, judge the total.
- confidence: "low" if you are guessing from a partial or blurry view, otherwise "high".`;
    const parts = [{ text: prompt }, ...images.map(d => ({ inlineData: { mimeType: "image/jpeg", data: d } }))];
    let r, last;
    for (const model of [models[0], ...models]) {
      try { r = await model.generateContent(parts); break; }
      catch (e) { last = e; console.warn("scan model failed", e); if (!busy(e)) throw e; }
    }
    if (!r) throw last;
    let t = r.response.text().trim().replace(/^```(json)?/i, "").replace(/```$/, "");
    const j = JSON.parse(t);
    return Array.isArray(j) ? j : (j.items || []);
  };
}
</script>
